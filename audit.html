<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your SEO Audit Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white p-5">
    <div class="container glass-card">
        <h2>Your Website Audit Report</h2>
        <p>अपनी क्लाइंट डिटेल्स भरें, समस्याएं सेलेक्ट करें और पेमेंट पूरा करें:</p>
        
        <!-- क्लाइंट डीटेल्स फॉर्म इनपुट्स जोड़े गए हैं ताकि ईमेल/रिपोर्ट में सही डेटा जाए -->
        <div class="mb-4 p-3 bg-secondary rounded">
            <h5>Client Information</h5>
            <input type="text" id="name" class="form-control mb-2" placeholder="Full Name" value="Client">
            <input type="email" id="email" class="form-control mb-2" placeholder="Email Address" value="insightifytechinnovations@gmail.com">
            <input type="text" id="phone" class="form-control mb-2" placeholder="Phone Number" value="8077644565">
            <input type="text" id="website" class="form-control" placeholder="Website URL" value="https://insightifyinnovations.com">
        </div>

        <form id="audit-form">
            <div class="form-check mb-2">
                <input class="form-check-input problem-chk" type="checkbox" value="500" data-price="500" data-name="Fix Broken Links" id="issue1" onchange="calculateTotal()">
                <label class="form-check-label" for="issue1">Fix Broken Links - ₹500</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input problem-chk" type="checkbox" value="1000" data-price="1000" data-name="Meta Tag Optimization" id="issue2" onchange="calculateTotal()">
                <label class="form-check-label" for="issue2">Meta Tag Optimization - ₹1000</label>
            </div>
            
            <hr>
            <h4>Total (Including 18% GST): ₹<span id="totalAmountText">0</span></h4>
            <div id="total-amount" class="d-none">0</div>
            
            <div class="mt-3">
                <button type="button" class="btn btn-success me-2" onclick="proceedToPayment()">Pay Now (Instant AI Fix)</button>
                <button type="button" class="btn btn-warning" onclick="proceedPayLater()">Pay Later (Manual Review)</button>
            </div>
        </form>
    </div>

    <script>
        function calculateTotal() {
            let total = 0;
            if(document.getElementById('issue1').checked) total += 500;
            if(document.getElementById('issue2').checked) total += 1000;
            
            let finalAmount = total + (total * 0.18);
            
            let totalElem1 = document.getElementById('total-amount');
            let totalElem2 = document.getElementById('totalAmountText');
            
            if(totalElem1) totalElem1.innerText = finalAmount;
            if(totalElem2) totalElem2.innerText = finalAmount;
        }

        function proceedToPayment() {
            let total = 0;
            let selectedList = [];
            
            if(document.getElementById('issue1').checked) {
                total += 500;
                selectedList.push("Fix Broken Links");
            }
            if(document.getElementById('issue2').checked) {
                total += 1000;
                selectedList.push("Meta Tag Optimization");
            }

            if (total === 0) {
                alert("Please select at least one issue.");
                return;
            }

            let finalAmount = total + (total * 0.18);
            let nameVal = document.getElementById('name') ? document.getElementById('name').value : "Client";
            let emailVal = document.getElementById('email') ? document.getElementById('email').value : "insightifytechinnovations@gmail.com";
            let phoneVal = document.getElementById('phone') ? document.getElementById('phone').value : "8077644565";
            let webVal = document.getElementById('website') ? document.getElementById('website').value : "https://insightifyinnovations.com";

            var options = {
                "key": "rzp_live_TUiu15xHh1ZWpr",
                "amount": finalAmount * 100, 
                "currency": "INR",
                "name": "Insightify Tech Innovations",
                "description": "Selected AI Website Audit Solutions (" + selectedList.length + " items)",
                "handler": function (response){
                    alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
                    
                    fetch('/process-autofix', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            payment_id: response.razorpay_payment_id,
                            name: nameVal,
                            email: emailVal,
                            phone: phoneVal,
                            website: webVal,
                            selected_problems: selectedList,
                            total: finalAmount
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        console.log("Auto-fix report sent successfully:", data);
                        let formEl = document.getElementById('audit-form');
                        if(formEl) formEl.reset();
                        calculateTotal();
                    })
                    .catch(err => console.error("Error:", err));
                },
                "prefill": {
                    "name": nameVal,
                    "email": emailVal,
                    "contact": phoneVal
                },
                "theme": { "color": "#38bdf8" }
            };
            new Razorpay(options).open();
        }

        function proceedPayLater() {
            let selectedList = [];
            if(document.getElementById('issue1').checked) selectedList.push("Fix Broken Links");
            if(document.getElementById('issue2').checked) selectedList.push("Meta Tag Optimization");
            
            let nameVal = document.getElementById('name') ? document.getElementById('name').value : "Client";
            let emailVal = document.getElementById('email') ? document.getElementById('email').value : "insightifytechinnovations@gmail.com";
            let phoneVal = document.getElementById('phone') ? document.getElementById('phone').value : "8077644565";
            let webVal = document.getElementById('website') ? document.getElementById('website').value : "https://insightifyinnovations.com";

            fetch('/send-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: nameVal,
                    email: emailVal,
                    phone: phoneVal,
                    website: webVal,
                    requirements: "Pay Later Option Selected - Issues: " + selectedList.join(", ")
                })
            })
            .then(res => res.json())
            .then(data => {
                alert("Your Pay Later request has been recorded. Our team at Insightify Tech Innovations will contact you shortly!");
                let formEl = document.getElementById('audit-form');
                if(formEl) formEl.reset();
                calculateTotal();
            })
            .catch(err => console.error("Error:", err));
        }
    </script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
