<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <style>
        /* Smart Design CSS */
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .form-container { 
            max-width: 600px; margin: auto; background: white; 
            padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        h2 { text-align: center; color: #2c3e50; }
        input, textarea { 
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; 
            border-radius: 8px; box-sizing: border-box; 
        }
        button { 
            width: 100%; padding: 15px; background: #3498db; color: white; 
            border: none; border-radius: 8px; font-size: 18px; cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Insightify Tech Innovations</h2>
    <p>Apni website ki requirements yahan share karein:</p>
    
    <form action="/submit-form/" method="POST">
        <input type="text" name="name" placeholder="Aapka Poora Naam" required>
        <input type="tel" name="mobile" placeholder="Mobile / WhatsApp Number" required>
        <input type="email" name="email" placeholder="Email ID" required>
        <input type="url" name="url" placeholder="Aapki Website ka URL" required>
        <textarea name="requirements" rows="4" placeholder="Website ki Problems / Requirements..."></textarea>
        
        <button type="submit">Submit & Start AI Audit</button>
    </form>
</div>

</body>
</html>
