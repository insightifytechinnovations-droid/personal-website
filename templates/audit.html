<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your SEO Audit Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white p-5">
    <div class="container glass-card">
        <h2>Your Website Audit Report</h2>
        <p>नीचे दी गई समस्याओं को सेलेक्ट करें और अपना पेमेंट पूरा करें:</p>
        
        <form id="audit-form">
            <div class="form-check mb-2">
                <!-- script.js के साथ मैच करने के लिए problem-chk, data-price और data-name जोड़ा गया है -->
                <input class="form-check-input problem-chk" type="checkbox" value="500" data-price="500" data-name="Fix Broken Links" id="issue1" onchange="calculateTotal()">
                <label class="form-check-label" for="issue1">Fix Broken Links - ₹500</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input problem-chk" type="checkbox" value="1000" data-price="1000" data-name="Meta Tag Optimization" id="issue2" onchange="calculateTotal()">
                <label class="form-check-label" for="issue2">Meta Tag Optimization - ₹1000</label>
            </div>
            
            <hr>
            <!-- ID को 'totalAmountText' किया गया है ताकि external script.js इसे आसानी से ढूंढ सके -->
            <h4>Total (Including 18% GST): ₹<span id="totalAmountText">0</span></h4>
            <button type="button" class="btn btn-success" onclick="proceedToPayment()">Pay & Fix Now</button>
        </form>
    </div>

    <script>
        // आपका ऑरिजिनल कैलकुलेशन और पेमेंट फंक्शन सुरक्षित रखा गया है
        function calculateTotal() {
            let total = 0;
            if(document.getElementById('issue1').checked) total += 500;
            if(document.getElementById('issue2').checked) total += 1000;
            
            let finalAmount = total + (total * 0.18); // GST Addition
            
            // दोनों IDs पर वैल्यू अपडेट होगी ताकि कोई कन्फ्यूजन न हो
            let totalElem1 = document.getElementById('total-amount');
            let totalElem2 = document.getElementById('totalAmountText');
            
            if(totalElem1) totalElem1.innerText = finalAmount;
            if(totalElem2) totalElem2.innerText = finalAmount;
        }

        function proceedToPayment() {
            let total = 0;
            let selectedList = [];
            
            if(document.getElementById('issue1').checked) {
                total += 500;
                selectedList.push("Fix Broken Links");
            }
            if(document.getElementById('issue2').checked) {
                total += 1000;
                selectedList.push("Meta Tag Optimization");
            }

            if (total === 0) {
                alert("Please select at least one issue.");
                return;
            }

            let finalAmount = total + (total * 0.18);

            // Flask के /create-payment रूट को रिक्वेस्ट भेजें
            fetch('/create-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    amount: finalAmount,
                    name: "Client", 
                    email: "client@example.com",
                    phone: "0000000000"
                })
            })
            .then(response => response.json())
            .then(data => {
                // पेमेंट लिंक पर रीडायरेक्ट करें
                if(data.payment_url) {
                    window.location.href = data.payment_url;
                } else {
                    alert("Payment link generated, but URL missing.");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Payment link generation failed.");
            });
        }
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
