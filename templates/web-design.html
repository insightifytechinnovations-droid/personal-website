{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-xl">
    <h2 class="text-4xl font-bold text-blue-900 mb-6 text-center">AI-Powered Website Creation</h2>
    <p class="text-gray-600 mb-8 text-center">अपनी जरूरत बताएं, हमारा AI आपके लिए वेबसाइट का पूरा ब्लूप्रिंट तैयार कर देगा।</p>

    <form id="webOrderForm" class="space-y-4">
        <div>
            <label class="block font-semibold">आपका नाम</label>
            <input type="text" id="name" class="w-full p-3 border rounded" required>
        </div>
        <div>
            <label class="block font-semibold">वेबसाइट किस बारे में है? (e.g., E-commerce, Portfolio)</label>
            <textarea id="requirements" class="w-full p-3 border rounded" rows="4" placeholder="यहाँ अपनी डिमांड लिखें..." required></textarea>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-lg font-bold hover:bg-blue-700">
            AI से वेबसाइट प्लान जनरेट करें
        </button>
    </form>

    <div id="ai-output" class="mt-8 p-6 bg-blue-50 border-l-4 border-blue-600 hidden">
        <h3 class="font-bold text-xl mb-2">आपका कस्टमाइज्ड वेबसाइट प्लान:</h3>
        <p id="result-text" class="text-gray-700"></p>
    </div>
</div>

<script>
document.getElementById('webOrderForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.innerText = "AI सोच रहा है...";
    
    const data = {
        name: document.getElementById('name').value,
        requirements: document.getElementById('requirements').value
    };

    const response = await fetch('/submit-order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    
    const result = await response.json();
    document.getElementById('ai-output').classList.remove('hidden');
    document.getElementById('result-text').innerText = result.ai_output;
    btn.innerText = "सफलतापूर्वक सबमिट हुआ!";
};
</script>
{% endblock %}
