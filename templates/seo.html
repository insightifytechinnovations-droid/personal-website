{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-xl">
    <h2 class="text-4xl font-bold text-green-700 mb-6 text-center">AI-SEO Analyzer</h2>
    <p class="text-gray-600 mb-8 text-center">अपनी वेबसाइट का लिंक डालें, हमारा AI उसका फुल SEO ऑडिट करेगा।</p>

    <form id="seoForm" class="space-y-4">
        <div>
            <label class="block font-semibold">वेबसाइट URL</label>
            <input type="url" id="siteUrl" placeholder="https://example.com" class="w-full p-3 border rounded" required>
        </div>
        <div>
            <label class="block font-semibold">आपकी ईमेल</label>
            <input type="email" id="email" placeholder="name@company.com" class="w-full p-3 border rounded" required>
        </div>
        <button type="submit" id="seoBtn" class="w-full bg-green-600 text-white p-4 rounded-lg font-bold hover:bg-green-700">
            SEO रिपोर्ट जनरेट करें (AI)
        </button>
    </form>

    <div id="seo-result" class="mt-8 p-6 bg-green-50 border-l-4 border-green-600 hidden">
        <h3 class="font-bold text-xl mb-2 text-green-800">SEO ऑडिट रिपोर्ट:</h3>
        <ul id="report-list" class="list-disc pl-5 text-gray-700">
            </ul>
    </div>
</div>

<script>
document.getElementById('seoForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('seoBtn');
    btn.innerText = "विश्लेषण (Analyzing) चल रहा है...";
    
    const data = {
        url: document.getElementById('siteUrl').value,
        email: document.getElementById('email').value
    };

    // यह आपके AI इंजन को भेजेगा
    const response = await fetch('/analyze-seo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    
    const result = await response.json();
    document.getElementById('seo-result').classList.remove('hidden');
    document.getElementById('report-list').innerHTML = `<li>${result.report}</li>`;
    btn.innerText = "रिपोर्ट मिल गई!";
};
</script>
{% endblock %}
