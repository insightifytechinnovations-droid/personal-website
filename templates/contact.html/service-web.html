<!-- Simplified Form Snippet for service-web.html -->
<form id="orderForm" class="p-8 bg-white rounded shadow-md max-w-lg mx-auto">
    <h2 class="text-2xl font-bold mb-6">Request Your AI Website</h2>
    
    <input type="text" id="name" placeholder="Full Name" class="w-full mb-4 p-2 border" required>
    <input type="tel" id="phone" placeholder="Phone Number" class="w-full mb-4 p-2 border" required>
    <input type="text" id="firm" placeholder="Firm Name" class="w-full mb-4 p-2 border" required>
    <input type="text" id="gstin" placeholder="GSTIN" class="w-full mb-4 p-2 border">
    <textarea id="requirements" placeholder="Tell us your vision..." class="w-full mb-4 p-2 border" required></textarea>
    
    <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded">Submit Request</button>
</form>

<script>
    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            firm_name: document.getElementById('firm').value,
            gstin: document.getElementById('gstin').value,
            requirements: document.getElementById('requirements').value
        };

        const response = await fetch('/submit-order', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        
        if(response.ok) alert("Your request is being processed by our AI!");
    };
</script>
<div id="ai-result" class="mt-4 p-4 bg-gray-200 hidden">
    <h3 class="font-bold">आपका AI समाधान:</h3>
    <p id="response-text"></p>
</div>

<script>
    // सबमिट होने के बाद जवाब दिखाने का कोड
    // response.ai_answer को 'response-text' में डाल दें
</script>
