{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-xl border-t-8 border-purple-600">
    <div class="text-center mb-10">
        <h2 class="text-4xl font-bold text-purple-900 mb-2">Build Your Mobile App with AI</h2>
        <p class="text-gray-600">अपने ऐप का आइडिया बताएं, हमारा AI कोडिंग और डिज़ाइन प्लान तैयार करेगा।</p>
    </div>

    <form id="appForm" class="space-y-6">
        <div>
            <label class="block font-bold text-gray-700 mb-2">ऐप का नाम (App Name)</label>
            <input type="text" id="appName" placeholder="जैसे: My Grocery Store" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 outline-none" required>
        </div>

        <div>
            <label class="block font-bold text-gray-700 mb-2">प्लेटफार्म (Platform)</label>
            <select id="platform" class="w-full p-3 border-2 border-gray-200 rounded-lg outline-none">
                <option value="android">Android App</option>
                <option value="ios">iOS (Apple) App</option>
                <option value="both">दोनों (Android & iOS - Flutter/React Native)</option>
            </select>
        </div>

        <div>
            <label class="block font-bold text-gray-700 mb-2">ज़रूरी फीचर्स चुनें:</label>
            <div class="grid grid-cols-2 gap-3 bg-purple-50 p-4 rounded-lg">
                <label><input type="checkbox" name="feature" value="login"> Login System</label>
                <label><input type="checkbox" name="feature" value="payment"> Payment Gateway</label>
                <label><input type="checkbox" name="feature" value="gps"> GPS/Maps</label>
                <label><input type="checkbox" name="feature" value="chat"> Chat System</label>
                <label><input type="checkbox" name="feature" value="push"> Notifications</label>
                <label><input type="checkbox" name="feature" value="db"> Database Support</label>
            </div>
        </div>

        <div>
            <label class="block font-bold text-gray-700 mb-2">ऐप कैसे काम करेगा? (विस्तार से बताएं)</label>
            <textarea id="appDesc" rows="4" placeholder="क्लाइंट यहाँ लिखेगा: मुझे एक ऐसा ऐप चाहिए जिसमें लोग अपनी पुरानी कारें बेच सकें..." class="w-full p-3 border-2 border-gray-200 rounded-lg outline-none"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white p-4 rounded-lg font-bold text-xl hover:bg-purple-700 transition">
            AI से ऐप का ब्लूप्रिंट तैयार करवाएं
        </button>
    </form>

    <div id="app-ai-output" class="mt-10 p-6 bg-gray-50 border-2 border-dashed border-purple-300 rounded-xl hidden">
        <h3 class="font-bold text-2xl text-purple-800 mb-4">🚀 आपका AI ऐप प्लान तैयार है:</h3>
        <div id="app-result-text" class="text-gray-800 leading-relaxed whitespace-pre-wrap"></div>
        <div class="mt-6 p-4 bg-white rounded border text-sm text-gray-500">
            नोट: यह एक AI जनरेटेड ड्राफ्ट है। हमारी टीम इसे पूरी तरह से डेवेलप करने के लिए आपसे जल्द संपर्क करेगी।
        </div>
    </div>
</div>

<script>
document.getElementById('appForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.innerText = "AI ऐप डिज़ाइन कर रहा है... ⏳";
    btn.disabled = true;

    // फीचर्स इकट्ठा करना
    const selectedFeatures = Array.from(document.querySelectorAll('input[name="feature"]:checked')).map(f => f.value);
    
    const data = {
        requirements: `ऐप का नाम: ${document.getElementById('appName').value}, प्लेटफार्म: ${document.getElementById('platform').value}, फीचर्स: ${selectedFeatures.join(', ')}, विवरण: ${document.getElementById('appDesc').value}`
    };

    // AI को डिमांड भेजना
    const response = await fetch('/submit-order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    
    const result = await response.json();
    document.getElementById('app-ai-output').classList.remove('hidden');
    document.getElementById('app-result-text').innerText = result.ai_output;
    btn.innerText = "ऐप प्लान तैयार है!";
    btn.disabled = false;
};
</script>
{% endblock %}
