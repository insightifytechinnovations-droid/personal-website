{% extends 'base.html' %}
{% block content %}
<div class="max-w-6xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6 text-blue-900">Admin Dashboard</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-blue-600 text-white p-6 rounded-lg shadow">
            <h3 class="text-xl">Total Orders</h3>
            <p class="text-4xl font-bold">12</p>
        </div>
        <div class="bg-green-600 text-white p-6 rounded-lg shadow">
            <h3 class="text-xl">Active SEO Jobs</h3>
            <p class="text-4xl font-bold">5</p>
        </div>
        <div class="bg-purple-600 text-white p-6 rounded-lg shadow">
            <h3 class="text-xl">New App Leads</h3>
            <p class="text-4xl font-bold">3</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
        <h2 class="text-2xl font-bold mb-4">Recent Inquiries</h2>
        <table class="w-full text-left">
            <thead class="border-b">
                <tr>
                    <th class="p-3">Client Name</th>
                    <th class="p-3">Service</th>
                    <th class="p-3">Status</th>
                    <th class="p-3">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-b">
                    <td class="p-3">Rahul Kumar</td>
                    <td class="p-3">Mobile App</td>
                    <td class="p-3 text-yellow-600">Pending</td>
                    <td class="p-3"><button class="text-blue-600">View</button></td>
                </tr>
                </tbody>
        </table>
    </div>
</div>
{% endblock %}
